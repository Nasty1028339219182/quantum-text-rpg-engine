name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest
      - run: pytest -q
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pyinstaller
      - run: pyinstaller --noconfirm packaging/quantum-rpg.spec
      - run: python packaging/make_author_pack.py
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/QuantumRPG.exe
            dist/quantum-rpg-author-*.zip
          generate_release_notes: true
