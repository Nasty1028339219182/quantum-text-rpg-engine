id: greyford
title:
  ru: Седой Брод
  en: Greyford
author: Quantum
version: "1.3.0"
language: ru
include:
  - items/weapons.yaml
  - items/gear.yaml
  - items/consumables.yaml
  - items/trophies.yaml
  - encounters/wildlife.yaml
  - encounters/human.yaml
  - loot_tables/common.yaml
start:
  location: square
intro:
  ru: |
    Седой Брод — десять дворов у брода, который уже не седой, а грязный.
    Ты пришёл пешком. Здесь пропадают люди, и за находку платят хлебом
    и серебряной ложкой.

    На площади ждёт староста Бран.
  en: |
    Greyford is ten yards by a ford that is no longer grey, only muddy.
    You came on foot. People go missing here, and they pay for a finding
    with bread and a silver spoon.

    Elder Bran waits in the square.
win:
  flags: [mira_home]
  text:
    ru: |
      Мира стоит у колодца, живая, злая на бандитов и на волка, и на тебя —
      за то, что шёл так долго. Бран молча кладёт в ладонь ложку.

      Это достаточная победа для такой деревни.
    en: |
      Mira stands by the well, alive, angry at bandits and the wolf and at you
      for taking so long. Bran puts a spoon in your palm without a word.

      Victory enough for a village this size.
lose:
  text:
    ru: Брод принимает ещё одно тело. Колесо мельницы не останавливается.
    en: The ford takes another body. The mill wheel does not stop.
player:
  name_prompt: true
  name_prompt_text: {ru: "Как тебя зовут?", en: "What is your name?"}
  name: {ru: Путник, en: Traveler}
  stats: {str: 12, dex: 12, int: 10, con: 12, cha: 11, per: 12}
  hp: 24
  max_hp: 24
  gold: 10
  inventory: [travel_torch, dagger]
  equipment: {weapon: dagger}
  skills: {perception: 1, persuasion: 0, lockpick: 0, athletics: 1}
class_prompt: true
classes:
  warrior:
    name: {ru: Воин, en: Warrior}
    text: {ru: Топор, крепкое плечо., en: An axe and a solid shoulder.}
    stats: {str: 15, dex: 11, int: 9, con: 14, cha: 9, per: 10}
    hp: 32
    gold: 8
    mp: 6
    max_mp: 6
    inventory: [travel_torch, wood_axe, bandage]
    equipment: {weapon: wood_axe}
    skills: {athletics: 2, persuasion: 0, lockpick: 0, perception: 1}
  rogue:
    name: {ru: Ловкач, en: Rogue}
    text: {ru: Кинжал, тихий шаг, отмычки в голове., en: A dagger, a quiet step, lockpicks in the head.}
    stats: {str: 10, dex: 15, int: 12, con: 11, cha: 10, per: 14}
    hp: 22
    gold: 14
    mp: 4
    max_mp: 4
    inventory: [travel_torch, dagger, rope]
    equipment: {weapon: dagger}
    skills: {lockpick: 2, perception: 2, athletics: 0, persuasion: 0}
  speaker:
    name: {ru: Говорун, en: Speaker}
    text: {ru: Язык острее железа. И немного серебра., en: A tongue sharper than iron. And a little silver.}
    stats: {str: 10, dex: 11, int: 12, con: 12, cha: 15, per: 12}
    hp: 24
    gold: 22
    mp: 8
    max_mp: 8
    inventory: [travel_torch, dagger, bread]
    equipment: {weapon: dagger}
    skills: {persuasion: 2, perception: 1, lockpick: 0, athletics: 0}
settings:
  inventory_limit: 20
  party: 4
factions:
  village:
    name: {ru: Седой Брод, en: Greyford}
    start: 0
hunger:
  max: 40
  step: 1
  damage: 1
  rest: 0
time:
  day_length: 24
  start_hour: 9
  rest_hours: 8
  shop_closed: [night]
  night_encounter_bonus: 25
regions:
  ford:
    name: {ru: Седой Брод, en: Greyford}
    start: square
    rooms: [square, inn, mill, road, forest, den, camp, shrine]
  hill:
    name: {ru: Холм дозорных, en: Watch hill}
    aliases: [холм, hill, холм дозорных]
    start: hill
    rooms: [hill]
roads:
  - from: ford
    to: hill
    hours: 2
    chance: 40
    encounter: wolf
    text:
      ru: Колея уходит от брода на восток, к голому холму.
      en: A track leaves the ford toward a bare hill.
rumors:
  mira_south:
    when: {flag: asked_hilda}
    knows: [osip]
    text:
      ru: Хильда права. Девочка ушла югом, и след был не только её.
      en: Hilda is right. The girl went south, and the track was not only hers.
meters:
  thirst:
    name: {ru: Жажда, en: Thirst}
    max: 40
    start: 0
    step: 1
    move: 1
    wait: 1
    hour: 1
    fight: 1
    damage: 1
    rest: 0
    bands:
      - at: 8
        text: {ru: В горле сухо., en: The throat is dry.}
      - at: 20
        text: {ru: Жажда уже мешает., en: Thirst is in the way.}
ui:
  titles:
    shop: {ru: Прилавок, en: Counter}
    party: {ru: Свои, en: Ours}
    meters: {ru: Состояние, en: Condition}
    map: {ru: Схема, en: Plan}
  screens:
    shop:
      show: [gold, goods, sell]
      hint: {ru: Назови, что берёшь., en: Name what you take.}
    party:
      show: [hp, orders]
  actions:
    - label: {ru: Поклониться, en: Bow}
      command: look shrine
fx:
  hill:
    style: banner
    color: accent
    anim: type
    delay: 16
    sound: hit
    text: {ru: Ветер на холме, en: Wind on the hill}
  sparks:
    style: particles
    particles: spark
    color: accent
    text: {ru: Искры., en: Sparks.}
  quiet:
    style: quote
    color: dim
    text: {ru: В чаще тише, чем надо., en: The thicket is quieter than it should be.}
  done:
    steps:
      - sparks
      - {style: center, color: accent, text: {ru: КОНЕЦ СЛЕДА, en: END OF THE TRACK}}
  hooks:
    enter:
      forest: quiet
    quest_done:
      missing_mira: done
map:
  ford:
    - ["", shrine, ""]
    - [inn, square, mill]
    - ["", road, ""]
    - ["", forest, den]
    - ["", camp, ""]
  hill:
    - [hill]
audio:
  music_volume: 80
  sfx_volume: 100
  music:
    village: audio/village.wav
  sfx:
    coin: audio/coin.wav
    hit: audio/hit.wav
  cues:
    take: coin
    buy: coin
    sell: coin
    hit: hit
    win: coin
