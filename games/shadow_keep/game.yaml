id: shadow_keep
title:
  ru: Тень Крепости
  en: Shadow Keep
author: Quantum
version: "1.3.0"
language: ru
languages: [ru, en]
class_prompt: true
classes:
  warrior:
    name: {ru: Воин, en: Warrior}
    text: {ru: Крепче и злее в бою., en: Tougher, meaner in a fight.}
    stats: {str: 15, dex: 11, int: 9, con: 15, cha: 8, per: 10}
    hp: 36
    max_hp: 36
    gold: 14
    inventory: [torch, rusty_sword]
    equipment: {weapon: rusty_sword}
    skills: {athletics: 2, persuasion: 0, lockpick: 0, perception: 1}
  rogue:
    name: {ru: Ловкач, en: Rogue}
    text: {ru: Тише шаг, зорче глаз, замок не спор., en: Quieter step, sharper eye, locks don't argue.}
    stats: {str: 10, dex: 15, int: 12, con: 11, cha: 10, per: 14}
    hp: 26
    max_hp: 26
    gold: 22
    inventory: [torch, rusty_sword]
    equipment: {weapon: rusty_sword}
    skills: {lockpick: 2, perception: 2, athletics: 0, persuasion: 0}
  speaker:
    name: {ru: Говорун, en: Speaker}
    text: {ru: Слово дешевле меча. Иногда работает., en: A word is cheaper than a sword. Sometimes it works.}
    stats: {str: 10, dex: 11, int: 12, con: 12, cha: 15, per: 12}
    hp: 28
    max_hp: 28
    gold: 26
    inventory: [torch, rusty_sword]
    equipment: {weapon: rusty_sword}
    skills: {persuasion: 2, perception: 1, lockpick: 0, athletics: 0}
start:
  location: courtyard
intro:
  ru: |
    Ночь. Дождь стучит по камню. Перед тобой — врата крепости, из которой
    неделю не выходил ни один гонец. Тебя наняли за горсть серебра и обещание
    не задавать лишних вопросов.

    Факел в руке. Ржавый меч на поясе. Дальше — тьма.
  en: |
    Night. Rain on stone. Before you stand the gates of a keep that has sent
    no messenger for a week. You were hired for a handful of silver and a
    promise not to ask questions.

    A torch in your hand. A rusty sword at your belt. Beyond — darkness.
win:
  when:
    any:
      - flag: demon_slain
      - flag: dark_pact
  text:
    ru: |
      Варгос рассыпается в пепел. Крепость выдыхает — впервые за много ночей.
      На рассвете ты выйдешь во двор, и дождь смоет копоть с лат.

      Тень снята.
    en: |
      Vargos crumbles to ash. The keep exhales for the first time in many nights.
      At dawn you will walk into the courtyard, and the rain will wash the soot
      from your mail.

      The shadow is lifted.
  pact_text:
    ru: |
      Ты выходишь во двор уже не совсем человеком. Крепость молчит — и слушается.
      Это тоже победа. Просто не твоя.
    en: |
      You walk into the courtyard no longer quite a person. The keep is silent —
      and obedient. This too is a victory. Just not yours.
lose:
  text:
    ru: Камень принимает ещё одно тело. Крепость молчит.
    en: The stone takes another body. The keep is silent.
player:
  name_prompt: true
  name_prompt_text:
    ru: Как тебя зовут?
    en: What is your name?
  name:
    ru: Наёмник
    en: Mercenary
  stats:
    str: 13
    dex: 12
    int: 10
    con: 14
    cha: 10
    per: 12
  hp: 32
  max_hp: 32
  mp: 6
  max_mp: 6
  gold: 18
  inventory: [torch, rusty_sword]
  equipment:
    weapon: rusty_sword
  skills:
    perception: 1
    persuasion: 0
    lockpick: 0
    athletics: 1
settings:
  inventory_limit: 24
  weight_limit: 40
